name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy (решения)
        run: |
          shopt -s nullglob
          files=(m*/solutions/*.py bonus/*/solutions/*.py)
          if [ ${#files[@]} -gt 0 ]; then mypy "${files[@]}"; fi

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_template.py

  solutions:
    name: tests (solutions must pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
        env:
          PRACTICUM_TARGET: solutions

  exercises:
    name: tests (exercises must stay unsolved)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: заготовки не должны проходить и не должны падать
        run: python tools/check_exercises_unsolved.py
