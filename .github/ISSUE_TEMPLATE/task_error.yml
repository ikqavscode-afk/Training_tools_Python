name: Ошибка в задании
description: Неверный тест, опечатка, неясная формулировка
labels: [bug, content]
body:
  - type: input
    id: module
    attributes:
      label: Модуль и задание
      placeholder: "m01-search, задание 2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что не так
      description: Что вы ожидали и что получили
    validations:
      required: true
