repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^(m\d+-[a-z0-9-]+|bonus/b\d+-[a-z0-9-]+)/solutions/.*\.py$
        args: [--strict]
